name: release-main

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A recent version of the action is needed: v1 installs an old uv without ``uv build`` and ``uv publish``.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Check version matches tag
        id: vars
        run: echo tag=${GITHUB_REF#refs/*/v} >> $GITHUB_OUTPUT

      - name: Assert version
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])" > version.txt
          echo "pyproject version: $(cat version.txt)"
          echo "tag: ${{ steps.vars.outputs.tag }}"
          test "$(cat version.txt)" = "${{ steps.vars.outputs.tag }}"

      # ``uv build`` and ``uv publish`` do not use the project's virtual environment, so they do not conflict with the
      # versions pinned in uv.lock (contrary to ``uv run python -m build`` and ``uv run twine``).
      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
